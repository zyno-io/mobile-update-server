  /api/apps/{appId}/channels/{channelId}/updates/{id}:
    get:
      operationId: getUpdatesShow
      tags:
        - updates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                  appId:
                    type: string
                    format: uuid
                    pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                  channelId:
                    type: string
                    format: uuid
                    pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                  platform:
                    $ref: "#/components/schemas/TargetPlatform"
                  runtimeVersion:
                    type: string
                  otaVersion:
                    type:
                      - string
                      - "null"
                  status:
                    $ref: "#/components/schemas/UpdateStatus"
                  commitHash:
                    type: string
                  commitSubject:
                    type: string
                  commitAuthor:
                    type: string
                  ciJobId:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  releasedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  supersededAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  supersededById:
                    type:
                      - string
                      - "null"
                    format: uuid
                    pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
                  assets:
                    type: array
                    items:
                      $ref: "#/components/schemas/IUpdateAssetResponse"
                required:
                  - id
                  - appId
                  - channelId
                  - platform
                  - runtimeVersion
                  - otaVersion
                  - status
                  - commitHash
                  - commitSubject
                  - commitAuthor
                  - ciJobId
                  - createdAt
                  - releasedAt
                  - supersededAt
                  - supersededById
                  - assets
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
