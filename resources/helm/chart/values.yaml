# Container image, e.g. ghcr.io/zyno-io/mobile-update-server:26.509.1432-abc123.
# Typically passed at deploy time via `--set image=...`.
image: ''

# Application version label, surfaced on Pod metadata for observability.
# Typically passed at deploy time via `--set version=...`.
version: ''

imagePullSecrets: []

replicas: 1

ingress:
  enabled: false
  host: mobile-updates.example.com
  annotations: {}
  tls:
    enabled: true
    secretName: mobile-update-server-tls

env:
  PUBLIC_BASE_URL: ''

  MYSQL_HOST: ''
  MYSQL_PORT: '3306'
  MYSQL_USER: mus
  MYSQL_DATABASE: mobile_update_server

  S3_ENDPOINT: ''
  S3_REGION: us-east-1
  S3_BUCKET: mobile-update-server

secret:
  # Name of the Kubernetes Secret to mount into the container as env vars.
  # Defaults to the release name when unset.
  name: mobile-update-server-secrets

  # Set `values` to have the chart create the Secret for you.
  # Leave commented to mount an existing Secret with `name` above.
  # values:
  #   MYSQL_PASSWORD_SECRET: ""
  #   S3_ACCESS_KEY_ID: ""
  #   S3_ACCESS_SECRET: ""
  #   AUTH_JWT_SECRET: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
