.node26-corepack:
  before_script:
    - &node26_corepack |-
      if command -v npm >/dev/null 2>&1 && node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 26 ? 1 : 0)'; then
        if command -v apk >/dev/null 2>&1 && [ "$(id -u)" = 0 ]; then
          apk add --no-cache bash git
        fi
        if ! command -v corepack >/dev/null 2>&1; then
          npm install --global corepack --registry=https://registry.npmjs.org/
        fi
        corepack enable
      fi
default:
  interruptible: true
  before_script:
    - *node26_corepack

stages:
  - test
  - build
  - deploy
  - post-deploy
  - mirror

prepare build:
  needs: []
  stage: .pre
  image:
    name: alpine/git
    entrypoint: ['']
  script: |
    BUILD_VERSION=$(TZ=UTC0 git show -s --format=%cd --date=format-local:'%y.%-m%d.%-H%M' HEAD)
    echo Build version: $BUILD_VERSION
    echo "BUILD_VERSION=$BUILD_VERSION" >> ci.env
  artifacts:
    reports:
      dotenv: ci.env

.test-base:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip test\]/
      when: never
    - when: always
  before_script:
    - *node26_corepack
    - corepack enable
    - yarn --immutable

.test-services:
  extends: .test-base
  image: mcr.microsoft.com/playwright:v1.64.1-jammy
  services:
    - name: mysql:8
      variables:
        MYSQL_ROOT_PASSWORD: secret
        MYSQL_DATABASE: mus
    - name: chrislusf/seaweedfs:latest
      alias: seaweedfs
      entrypoint: ['sh', '-c']
      command:
        - |
          echo '{"identities":[{"name":"test","credentials":[{"accessKey":"test","secretKey":"test"}],"actions":["Admin"]}]}' > /tmp/s3.json
          exec weed server -s3 -s3.config=/tmp/s3.json
  variables:
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY_ID: test
    S3_ACCESS_SECRET: test
    S3_BUCKET: mus
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
  before_script:
    - |-
      # Keep the pinned browser/font image while using the latest Node 26.
      npm install --global --prefix /tmp/node26 node@26 corepack --registry=https://registry.npmjs.org/
      export PATH="/tmp/node26/bin:$PATH"
      corepack enable --install-directory /tmp/node26/bin
      node --version
    - *node26_corepack
    - corepack enable
    - yarn --immutable

test:api:
  extends: .test-services
  script:
    - yarn workspace @zyno-io/mobile-update-server-api test

test:e2e:
  extends: .test-services
  tags:
    - highmem
  script: yarn test:e2e
  artifacts:
    when: always
    paths:
      - packages/ui/screenshots
      - packages/ui/playwright-report
      - packages/ui/test-results
    expire_in: 1 week

test:cli:
  extends: .test-base
  image:
    name: node:26-alpine
    pull_policy: always
  script: yarn workspace @zyno-io/mobile-update-server-cli test

test:ui:types:
  extends: .test-base
  image:
    name: node:26-alpine
    pull_policy: always
  script:
    - yarn workspace @zyno-io/mobile-update-server-ui exec npx
      generate-openapi-client
    - yarn workspace @zyno-io/mobile-update-server-ui typecheck

visual regression test:
  needs:
    - test:e2e
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip vrt\]/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip test\]/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[defer vrt\]/
      when: never
    - when: on_success
  stage: test
  image: ghcr.io/zyno-io/pixelci/cli
  variables:
    PIXELCI_IMAGES_PATH: packages/ui/screenshots
  script: pixelci

.build-base:
  stage: build
  image: ghcr.io/zyno-io/container-tooling:latest
  before_script:
    - *node26_corepack
    - |

      buildah login \
        --username="${CI_REGISTRY_USER}" \
        --password="${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY}"

build:canary:
  dependencies:
    - prepare build
  extends: .build-base
  rules:
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script: |
    BUILD_TAG=${BUILD_VERSION}-${CI_COMMIT_SHORT_SHA}
    echo "Build tag: ${BUILD_TAG}"
    buildah bud --pull=always \
      -t ${CI_REGISTRY_IMAGE}:canary \
      -t ${CI_REGISTRY_IMAGE}:${BUILD_TAG} \
      .
    buildah push ${CI_REGISTRY_IMAGE}:canary
    buildah push ${CI_REGISTRY_IMAGE}:${BUILD_TAG}

build:canary:cli:
  dependencies:
    - prepare build
  extends: .build-base
  rules:
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script: |
    BUILD_TAG=${BUILD_VERSION}-${CI_COMMIT_SHORT_SHA}
    echo "Build tag: ${BUILD_TAG}"
    buildah bud --pull=always \
      -f packages/cli/Dockerfile \
      -t ${CI_REGISTRY_IMAGE}/cli:canary \
      -t ${CI_REGISTRY_IMAGE}/cli:${BUILD_TAG} \
      .
    buildah push ${CI_REGISTRY_IMAGE}/cli:canary
    buildah push ${CI_REGISTRY_IMAGE}/cli:${BUILD_TAG}

publish:cli:npm:
  stage: deploy
  dependencies:
    - prepare build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  image:
    name: node:26-alpine
    pull_policy: always
  before_script:
    - *node26_corepack
    - corepack enable
    - yarn --immutable
  script: |
    echo "Publishing @zyno-io/mobile-update-server-cli@${BUILD_VERSION}"
    yarn workspace @zyno-io/mobile-update-server-cli build
    npm config set -- //${PRIVATE_NPM_HOST}/:_authToken="${PRIVATE_NPM_PUBLISHER_TOKEN}"
    cd packages/cli
    npm pkg set version="${BUILD_VERSION}"
    npm publish --registry "https://${PRIVATE_NPM_HOST}/"

deploy:
  stage: deploy
  dependencies:
    - prepare build
  rules:
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  image: ghcr.io/zyno-io/dag/cli:latest
  script:
    - cd resources/helm/chart
    - dag-deploy . --server ${DAG_SERVER_URL} --deploy-version $BUILD_VERSION
      --set version=${BUILD_VERSION} --set
      image=${CI_REGISTRY_IMAGE}:${BUILD_VERSION}-${CI_COMMIT_SHORT_SHA}

mirror:
  stage: mirror
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  image:
    name: alpine/git
    entrypoint: ['']
  script: |
    export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
    mkdir -p ~/.ssh
    echo "$GITHUB_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    chmod 600 ~/.ssh/id_ed25519
    git remote add github git@github.com:zyno-io/mobile-update-server.git
    git push -u github HEAD:main
