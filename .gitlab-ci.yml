default:
  interruptible: true

stages:
  - test
  - build
  - deploy
  - post-deploy
  - mirror

.test-base:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip test\]/
      when: never
    - when: always
  before_script:
    - corepack enable
    - yarn --immutable

.test-services:
  extends: .test-base
  image: mcr.microsoft.com/playwright:v1.59.1-jammy
  services:
    - name: mysql:8
      variables:
        MYSQL_ROOT_PASSWORD: secret
        MYSQL_DATABASE: mus
    - name: chrislusf/seaweedfs:latest
      alias: seaweedfs
      entrypoint: ['sh', '-c']
      command:
        - |
          echo '{"identities":[{"name":"test","credentials":[{"accessKey":"test","secretKey":"test"}],"actions":["Admin"]}]}' > /tmp/s3.json
          exec weed server -s3 -s3.config=/tmp/s3.json
  variables:
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY_ID: test
    S3_ACCESS_SECRET: test
    S3_BUCKET: mus
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306

test:api:
  extends: .test-services
  script:
    - yarn workspace @zyno-io/mobile-update-server-api test

test:e2e:
  extends: .test-services
  tags:
    - highmem
  script: yarn test:e2e
  artifacts:
    when: always
    paths:
      - packages/ui/screenshots
      - packages/ui/playwright-report
      - packages/ui/test-results
    expire_in: 1 week

test:cli:
  extends: .test-base
  image: node:22
  script: yarn workspace @zyno-io/mobile-update-server-cli test

test:ui:types:
  extends: .test-base
  image: node:22
  script:
    - yarn workspace @zyno-io/mobile-update-server-ui exec npx generate-openapi-client
    - yarn workspace @zyno-io/mobile-update-server-ui typecheck

visual regression test:
  needs:
    - test:e2e
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip vrt\]/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip test\]/
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[defer vrt\]/
      when: never
    - when: on_success
  stage: test
  image: ghcr.io/zyno-io/pixelci/cli
  variables:
    PIXELCI_IMAGES_PATH: packages/ui/screenshots
  script: pixelci

.build-base:
  stage: build
  dependencies: []
  image: quay.io/containers/buildah
  before_script:
    - |

      buildah login \
        --username=${CI_REGISTRY_USER} \
        --password=${CI_REGISTRY_PASSWORD} \
        ${CI_REGISTRY}

build:canary:
  extends: .build-base
  rules:
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script: |
    BUILD_VERSION=${CI_PIPELINE_CREATED_AT:2:2}.${CI_PIPELINE_CREATED_AT:5:2}${CI_PIPELINE_CREATED_AT:8:2}.${CI_PIPELINE_CREATED_AT:11:2}${CI_PIPELINE_CREATED_AT:14:2}
    BUILD_VERSION=$(echo -n ${BUILD_VERSION} | sed -E 's/\.0+/./g')
    BUILD_TAG=${BUILD_VERSION}-${CI_COMMIT_SHORT_SHA}
    echo "Build tag: ${BUILD_TAG}"
    buildah bud \
      -t ${CI_REGISTRY_IMAGE}:canary \
      -t ${CI_REGISTRY_IMAGE}:${BUILD_TAG} \
      .
    buildah push ${CI_REGISTRY_IMAGE}:canary
    buildah push ${CI_REGISTRY_IMAGE}:${BUILD_TAG}

build:canary:cli:
  extends: .build-base
  rules:
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  script: |
    BUILD_VERSION=${CI_PIPELINE_CREATED_AT:2:2}.${CI_PIPELINE_CREATED_AT:5:2}${CI_PIPELINE_CREATED_AT:8:2}.${CI_PIPELINE_CREATED_AT:11:2}${CI_PIPELINE_CREATED_AT:14:2}
    BUILD_VERSION=$(echo -n ${BUILD_VERSION} | sed -E 's/\.0+/./g')
    BUILD_TAG=${BUILD_VERSION}-${CI_COMMIT_SHORT_SHA}
    echo "Build tag: ${BUILD_TAG}"
    buildah bud \
      -f packages/cli/Dockerfile \
      -t ${CI_REGISTRY_IMAGE}/cli:canary \
      -t ${CI_REGISTRY_IMAGE}/cli:${BUILD_TAG} \
      .
    buildah push ${CI_REGISTRY_IMAGE}/cli:canary
    buildah push ${CI_REGISTRY_IMAGE}/cli:${BUILD_TAG}

publish:cli:npm:
  stage: deploy
  needs:
    - test:cli
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  image: node:22
  before_script:
    - corepack enable
    - yarn --immutable
  script: |
    BUILD_VERSION=${CI_PIPELINE_CREATED_AT:2:2}.${CI_PIPELINE_CREATED_AT:5:2}${CI_PIPELINE_CREATED_AT:8:2}.${CI_PIPELINE_CREATED_AT:11:2}${CI_PIPELINE_CREATED_AT:14:2}
    BUILD_VERSION=$(echo -n ${BUILD_VERSION} | sed -E 's/\.0+/./g')
    echo "Publishing @zyno-io/mobile-update-server-cli@${BUILD_VERSION}"
    yarn workspace @zyno-io/mobile-update-server-cli build
    cd packages/cli
    npm pkg set version=${BUILD_VERSION}
    echo "//registry.npmjs.org/:_authToken=${NPM_PUBLISH_TOKEN}" > ~/.npmrc
    npm publish

deploy:
  stage: deploy
  needs:
    - build:canary
    - build:canary:cli
  rules:
    - if: $CI_COMMIT_TITLE =~ /^v\d+\.\d+\.\d+$/
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
  image: ghcr.io/zyno-io/dag/cli:latest
  script:
    - |
      BUILD_VERSION=${CI_PIPELINE_CREATED_AT:2:2}.${CI_PIPELINE_CREATED_AT:5:2}${CI_PIPELINE_CREATED_AT:8:2}.${CI_PIPELINE_CREATED_AT:11:2}${CI_PIPELINE_CREATED_AT:14:2}
      BUILD_VERSION=$(echo -n ${BUILD_VERSION} | sed -E 's/\.0+/./g')
      echo "Build version: ${BUILD_VERSION}"
    - cd resources/helm/chart
    - dag-deploy .
      --server ${DAG_SERVER_URL}
      --deploy-version $BUILD_VERSION
      --set version=${BUILD_VERSION}
      --set image=${CI_REGISTRY_IMAGE}:${BUILD_VERSION}-${CI_COMMIT_SHORT_SHA}
