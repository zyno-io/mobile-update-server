enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.17.1.cjs

# openapi-ts generates code with the TypeScript JS compiler API (ts.SyntaxKind, ts.factory), which
# the native Go compiler in typescript@7 does not expose — it crashes on `ts.SyntaxKind` being
# undefined. Its own peer range (>=5.5.3) wrongly accepts 7.x, so pin the last JS-API TypeScript as
# a dependency of that package; yarn nests it there, leaving the hoisted typescript@7 (which ttsc /
# tsgo needs to build the API) alone.
packageExtensions:
  '@hey-api/openapi-ts@*':
    dependencies:
      typescript: '~6'

npmPreapprovedPackages:
  - '@zyno-platform/*'
  - '@zyno-io/*'
